<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="50%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>

    <!-- Neon Fiery Crimson Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff4d6d"/>
      <stop offset="65%" stop-color="#ff003c"/>
      <stop offset="100%" stop-color="#c40024"/>
    </linearGradient>

    <!-- Accent Amber Flare -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>

    <!-- Outer Rim Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="124" ry="124" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>

  <!-- Inner Cyberpunk Highlight Border -->
  <rect x="42" y="42" width="428" height="428" rx="106" ry="106" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.35"/>

  <!-- Top Laser Specular Line -->
  <path d="M 140 42 L 372 42" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round" filter="url(#coreGlow)"/>

  <!-- Cyber Monogram "P" Stylized Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Spine of "P" with Angled Chamfers -->
    <path d="M 148 128 L 208 128 L 208 384 L 148 384 Z" fill="url(#neonGrad)"/>

    <!-- Upper Loop of "P" with Cyberpunk Geometric Cuts -->
    <path d="M 208 128 L 316 128 C 364 128 396 156 396 208 C 396 260 364 288 316 288 L 208 288 Z" fill="url(#neonGrad)"/>

    <!-- Inner Cutout Hole of "P" (Counter-Space) -->
    <path d="M 208 184 L 300 184 C 324 184 340 194 340 208 C 340 222 324 232 300 232 L 208 232 Z" fill="#08080a"/>

    <!-- High-Tech Diagonal Speed Accent / Laser Slash -->
    <polygon points="236,312 360,312 320,384 196,384" fill="url(#amberGrad)" opacity="0.95"/>

    <!-- Glowing Cyber Core Telemetry Dot -->
    <circle cx="376" cy="140" r="14" fill="#00ff9d" filter="url(#coreGlow)"/>
  </g>
</svg>
